<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wyre</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #0b0c12;
      color: #f7f8fc;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    .splash { text-align: center; }
    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto;
      border-radius: 22px;
      background: linear-gradient(135deg, #8b5cf6, #2563eb);
      display: grid;
      place-items: center;
      box-shadow: 0 18px 45px rgba(139, 92, 246, 0.35);
      animation: breathe 2.4s ease-in-out infinite;
    }
    .mark svg { width: 34px; height: 34px; }
    .hint { margin-top: 18px; font-size: 13px; color: #8f96a8; letter-spacing: -0.02em; }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.92; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="mark">
      <svg viewBox="0 0 36 36" aria-hidden="true">
        <path d="M6 10l5 17 7-11 7 11 5-17" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2" />
      </svg>
    </div>
    <p class="hint">Wyre</p>
  </div>
</body>
</html>
